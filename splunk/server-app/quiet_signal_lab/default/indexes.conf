# One index for everything the Raspberry Pi sends.
# Capped at 5 GB and 90 days, which is far more than a home lab produces.

[pilab]
homePath   = $SPLUNK_DB/pilab/db
coldPath   = $SPLUNK_DB/pilab/colddb
thawedPath = $SPLUNK_DB/pilab/thaweddb
maxTotalDataSizeMB = 5120
frozenTimePeriodInSecs = 7776000
