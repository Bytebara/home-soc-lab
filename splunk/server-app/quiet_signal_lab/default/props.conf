# How Splunk reads each log type from the Pi.

# CrowdSec writes key=value lines:  time="2026-10-23T20:01:02Z" level=info msg="..."
[crowdsec]
TIME_PREFIX = time="
MAX_TIMESTAMP_LOOKAHEAD = 40
KV_MODE = auto
SHOULD_LINEMERGE = false
EXTRACT-crowdsec_ban = Ip (?<src_ip>[0-9a-fA-F:.]+) performed '(?<scenario>[^']+)' \((?<event_count>\d+) events

[crowdsec:bouncer]
TIME_PREFIX = time="
MAX_TIMESTAMP_LOOKAHEAD = 40
KV_MODE = auto
SHOULD_LINEMERGE = false

# ufw firewall lines:  [UFW BLOCK] IN=eth0 ... SRC=203.0.113.5 DST=... PROTO=TCP SPT=40000 DPT=23
[ufw]
SHOULD_LINEMERGE = false
KV_MODE = auto
EXTRACT-ufw_action = \[UFW (?<ufw_action>[A-Z ]+)\]

# Fields for SSH and sudo events in auth.log
[linux_secure]
EXTRACT-ssh_src = (?:from|user \S+) (?<src_ip>[0-9a-fA-F:.]+) port (?<src_port>\d+)
EXTRACT-ssh_invalid_user = Invalid user (?<attempted_user>\S*) from
EXTRACT-ssh_accepted = Accepted (?<auth_method>\S+) for (?<user>\S+) from
EXTRACT-sudo = sudo:\s+(?<sudo_user>\S+)\s*:.*?COMMAND=(?<sudo_command>.+)$

# Caddy web access log (JSON), turned on in Phase 5.
# Behind Cloudflare Tunnel, the visitor's real address is in the Cf-Connecting-Ip header.
[caddy:access]
KV_MODE = json
SHOULD_LINEMERGE = false
TIME_PREFIX = "ts":
MAX_TIMESTAMP_LOOKAHEAD = 20
EVAL-client_ip = coalesce(mvindex('request.headers.Cf-Connecting-Ip{}', 0), 'request.client_ip', 'request.remote_ip')

# Pi-hole DNS query log (dnsmasq format), added by 05-pihole.sh. One lookup writes a few lines:
#   query[A] example.com from 192.168.1.20         who asked for what
#   forwarded example.com to 9.9.9.9               sent upstream (not cached)
#   reply example.com is 192.0.2.80                the answer
#   gravity blocked ads.example.net is 0.0.0.0     blocked by a blocklist
# The patterns aren't tied to the start of the line, so they also work if Pi-hole adds
# extra details (query IDs, client ports) before the message.
[pihole]
SHOULD_LINEMERGE = false
MAX_TIMESTAMP_LOOKAHEAD = 32
EXTRACT-dns_query = (?:^|\s)query\[(?<dns_qtype>[A-Za-z0-9]+)\] (?<dns_query>\S+) from (?<dns_client>[0-9a-fA-F:.]+)
EXTRACT-dns_block = (?:^|\s)(?<dns_block_reason>gravity blocked|regex blocked|exactly blocked|regex denied|exactly denied|regex blacklisted|exactly blacklisted|special domain) (?<dns_blocked_domain>\S+) is
EXTRACT-dns_reply = (?:^|\s)(?<dns_reply_type>reply|cached|cached-stale) (?<dns_reply_domain>\S+) is (?<dns_answer>\S+)
EXTRACT-dns_forward = (?:^|\s)forwarded (?<dns_forwarded_domain>\S+) to (?<dns_upstream>[0-9a-fA-F:.#]+)
