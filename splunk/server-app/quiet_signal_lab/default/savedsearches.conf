# Saved searches for the Quiet Signal lab. Find them in Splunk under
# Quiet Signal Lab > Reports. Each one is also explained in splunk/searches.md.

[QS - SSH failed and invalid logins by source]
description = Who is trying to log in to the Pi over SSH and failing.
search = index=pilab sourcetype=linux_secure ("Invalid user" OR "Failed password" OR "Connection closed by authenticating user" OR "Disconnected from authenticating user") \
| stats count AS attempts, values(attempted_user) AS usernames_tried, latest(_time) AS last_seen BY src_ip \
| sort - attempts \
| convert ctime(last_seen)
dispatch.earliest_time = -7d
dispatch.latest_time = now

[QS - SSH successful logins]
description = Every successful SSH login. Anything you don't recognise is worth investigating.
search = index=pilab sourcetype=linux_secure "Accepted" \
| table _time host user auth_method src_ip \
| sort - _time
dispatch.earliest_time = -7d
dispatch.latest_time = now

[QS - sudo commands]
description = Admin commands run with sudo on the Pi.
search = index=pilab sourcetype=linux_secure "COMMAND=" \
| table _time host sudo_user sudo_command \
| sort - _time
dispatch.earliest_time = -7d
dispatch.latest_time = now

[QS - CrowdSec bans by scenario]
description = Attacks CrowdSec detected and blocked, grouped by attack type.
search = index=pilab sourcetype=crowdsec "performed" \
| stats count AS bans, dc(src_ip) AS unique_sources, values(src_ip) AS sources BY scenario \
| sort - bans
dispatch.earliest_time = -30d
dispatch.latest_time = now

[QS - Firewall blocks by port]
description = Which ports outsiders try to reach. Common: 23 (telnet), 445 (Windows file sharing), 3389 (remote desktop). Protocols without ports (ICMP, IGMP) show as "no port".
search = index=pilab sourcetype=ufw ufw_action="BLOCK" \
| fillnull value="no port" DPT \
| stats count AS blocks, dc(SRC) AS unique_sources BY DPT PROTO \
| rename DPT AS dest_port, PROTO AS protocol \
| sort - blocks
dispatch.earliest_time = -7d
dispatch.latest_time = now

[QS - Web requests by visitor (Phase 5)]
description = Requests to the Pi's web server by real visitor address. Turn on the Caddy input first.
search = index=pilab sourcetype=caddy:access \
| stats count AS requests, dc(request.uri) AS unique_paths, values(status) AS status_codes BY client_ip \
| sort - requests
dispatch.earliest_time = -7d
dispatch.latest_time = now

[QS - Web scanning attempts (Phase 5)]
description = Requests for paths that don't exist on a static site but that scanners probe for.
search = index=pilab sourcetype=caddy:access \
| search request.uri="*wp-login*" OR request.uri="*wp-admin*" OR request.uri="*.env*" OR request.uri="*.git/*" OR request.uri="*phpmyadmin*" OR request.uri="*/cgi-bin/*" OR request.uri="*xmlrpc.php*" \
| stats count AS probes, values(request.uri) AS paths BY client_ip \
| sort - probes
dispatch.earliest_time = -7d
dispatch.latest_time = now

[QS - DNS lookups by device (Pi-hole)]
description = How many lookups each device makes through Pi-hole, and how many were blocked. Block lines don't name the device, so each block is matched to the latest query for the same domain.
search = index=pilab sourcetype=pihole (dns_query=* OR dns_block_reason=*) \
| reverse \
| eval domain=coalesce(dns_query, dns_blocked_domain) \
| streamstats last(dns_client) AS asked_by BY domain \
| fillnull value="unknown" asked_by \
| eval kind=if(isnotnull(dns_block_reason), "blocked", "query") \
| stats count(eval(kind="query")) AS lookups, count(eval(kind="blocked")) AS blocked, dc(dns_query) AS unique_domains BY asked_by \
| rename asked_by AS dns_client \
| eval blocked_pct = round(100 * blocked / lookups, 1) \
| sort - lookups
dispatch.earliest_time = -24h
dispatch.latest_time = now

[QS - DNS top domains (Pi-hole)]
description = The most looked-up domains. Good for learning what "normal" looks like on your network.
search = index=pilab sourcetype=pihole dns_query=* \
| stats count AS lookups, dc(dns_client) AS devices BY dns_query \
| sort - lookups \
| head 25
dispatch.earliest_time = -24h
dispatch.latest_time = now

[QS - DNS blocked domains (Pi-hole)]
description = Ad, tracker and bad domains Pi-hole refused to answer, and why.
search = index=pilab sourcetype=pihole dns_block_reason=* \
| stats count AS blocks BY dns_blocked_domain dns_block_reason \
| sort - blocks \
| head 25
dispatch.earliest_time = -24h
dispatch.latest_time = now

[QS - DNS odd-looking domains (Pi-hole)]
description = Threat hunting: very long names or many dots, which can mean tracking IDs, malware beacons or data hidden in DNS (tunneling). Most hits are harmless (CDNs, telemetry); the point is to look and explain.
search = index=pilab sourcetype=pihole dns_query=* NOT dns_query="*.arpa" \
| eval length=len(dns_query), labels=mvcount(split(dns_query, ".")) \
| where length > 50 OR labels > 6 \
| stats count AS lookups, earliest(_time) AS first_seen BY dns_query dns_client length labels \
| sort - length \
| head 50 \
| convert ctime(first_seen)
dispatch.earliest_time = -7d
dispatch.latest_time = now

# Alert: needs the Splunk Enterprise trial (alerts don't run on the Free license).
# Turn it on in Settings > Searches, reports, and alerts while your trial lasts.
[QS - Pi stopped sending logs]
description = Fires when the Pi has sent nothing for 30 minutes (forwarder down, Pi off, or network problem).
search = | tstats latest(_time) AS last_event WHERE index=pilab BY host \
| eval minutes_silent = round((now() - last_event) / 60) \
| where minutes_silent > 30
cron_schedule = */15 * * * *
enableSched = 0
dispatch.earliest_time = -24h
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 3
