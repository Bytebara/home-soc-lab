# Quiet Signal lab: logs the Raspberry Pi sends to Splunk.
# Everything goes to the "pilab" index, created by the server app on the Ubuntu PC.

[default]
index = pilab

# SSH logins, sudo use and other authentication events
[monitor:///var/log/auth.log]
sourcetype = linux_secure
disabled = false

# General system messages
[monitor:///var/log/syslog]
sourcetype = syslog
disabled = false

# Firewall blocks (ufw)
[monitor:///var/log/ufw.log]
sourcetype = ufw
disabled = false

# CrowdSec detections and bans
[monitor:///var/log/crowdsec.log]
sourcetype = crowdsec
disabled = false

# CrowdSec firewall bouncer
[monitor:///var/log/crowdsec-firewall-bouncer.log]
sourcetype = crowdsec:bouncer
disabled = false

# Web server access log. Turn on in Phase 5 after Caddy is set up
# (change disabled to false and restart the forwarder).
[monitor:///var/log/caddy/access.log]
sourcetype = caddy:access
disabled = true
