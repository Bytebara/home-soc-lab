# Quiet Signal lab: Pi-hole's DNS query log (every lookup, every block).
# Kept in its own app so it never overwrites the main forwarder app's settings.
#
# Volume: roughly 3 to 6 lines per lookup. One Windows PC is usually a few MB a day,
# well inside Splunk Free's 500 MB/day and the 5 GB pilab index.

[monitor:///var/log/pihole/pihole.log]
index = pilab
sourcetype = pihole
disabled = false
